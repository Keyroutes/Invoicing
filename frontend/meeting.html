<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aniprotech Meet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
    --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
    --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
    --primary:#4f46e5;--primary-hover:#4338ca;
    --success:#10b981;--danger:#ef4444;--warning:#f59e0b;
    --radius:12px;--radius-sm:8px;
    --shadow:0 4px 24px rgba(0,0,0,0.3);
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input{font-family:inherit;outline:none}

/* ============ LANDING ============ */
.landing{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.landing-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:48px;max-width:480px;width:100%;text-align:center}
.landing-logo{font-size:1.8rem;font-weight:700;margin-bottom:8px}
.landing-logo span{color:var(--primary)}
.landing-sub{color:var(--text2);font-size:0.9rem;margin-bottom:32px}
.landing-divider{display:flex;align-items:center;gap:16px;margin:24px 0;color:var(--text3);font-size:0.8rem}
.landing-divider::before,.landing-divider::after{content:'';flex:1;height:1px;background:var(--bg3)}
.form-group{margin-bottom:16px;text-align:left}
.form-group label{display:block;font-size:0.8rem;color:var(--text2);margin-bottom:6px;font-weight:500}
.form-input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--bg3);border-radius:var(--radius-sm);color:var(--text);font-size:0.95rem;transition:border-color .2s}
.form-input:focus{border-color:var(--primary)}
.form-input::placeholder{color:var(--text3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:var(--radius-sm);font-size:0.9rem;font-weight:600;transition:all .2s;width:100%}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:transparent;border:1px solid var(--bg3);color:var(--text)}
.btn-outline:hover{background:var(--bg3)}

/* ============ MEETING ROOM ============ */
.meeting{display:none;height:100vh;flex-direction:column}
.meeting.active{display:flex}
.landing.hidden{display:none}

.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--bg3);z-index:10}
.top-bar-left{display:flex;align-items:center;gap:12px}
.top-bar-title{font-weight:600;font-size:0.95rem}
.top-bar-id{font-size:0.78rem;color:var(--text2);background:var(--bg);padding:4px 10px;border-radius:20px}
.top-bar-timer{font-size:0.82rem;color:var(--text2);font-variant-numeric:tabular-nums}
.top-bar-right{display:flex;align-items:center;gap:8px}
.participants-count{font-size:0.8rem;color:var(--text2);background:var(--bg);padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:4px}

.video-grid{flex:1;display:grid;gap:4px;padding:4px;background:var(--bg);overflow:auto;min-height:0}
.video-grid.grid-1{grid-template-columns:1fr}
.video-grid.grid-2{grid-template-columns:1fr 1fr}
.video-grid.grid-3,.video-grid.grid-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.video-grid.grid-5,.video-grid.grid-6{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}

.video-tile{position:relative;background:var(--bg2);border-radius:var(--radius-sm);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
.video-tile video{width:100%;height:100%;object-fit:cover}
.video-tile.screen-share video{object-fit:contain;background:#000}
.video-tile-name{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.6);color:#fff;padding:4px 10px;border-radius:6px;font-size:0.75rem;font-weight:500;backdrop-filter:blur(4px)}
.video-tile-icons{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.video-tile-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;background:rgba(0,0,0,0.5);color:#fff;backdrop-filter:blur(4px)}
.video-tile-icon.muted{background:var(--danger)}
.video-tile-placeholder{font-size:2.5rem;font-weight:700;color:var(--primary);width:80px;height:80px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff}
.video-tile-local{border:2px solid var(--primary)}

/* Controls */
.controls-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;background:var(--bg2);border-top:1px solid var(--bg3);z-index:10;flex-wrap:wrap}
.ctrl-btn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:var(--bg);color:var(--text);border:1px solid var(--bg3);transition:all .2s;position:relative}
.ctrl-btn:hover{background:var(--bg3)}
.ctrl-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.ctrl-btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.ctrl-btn.danger:hover{background:#dc2626}
.ctrl-btn.muted-state{background:var(--danger);border-color:var(--danger);color:#fff}
.ctrl-btn-label{position:absolute;bottom:-18px;font-size:0.6rem;color:var(--text3);white-space:nowrap}

/* Chat Panel */
.chat-panel{width:0;overflow:hidden;transition:width .3s;background:var(--bg2);border-left:1px solid var(--bg3);display:flex;flex-direction:column;flex-shrink:0}
.chat-panel.open{width:320px}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bg3)}
.chat-header h3{font-size:0.9rem;font-weight:600}
.chat-close{background:none;color:var(--text2);font-size:1.2rem;padding:4px}
.chat-messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:85%}
.chat-msg.self{align-self:flex-end}
.chat-msg-name{font-size:0.7rem;color:var(--text3);margin-bottom:2px}
.chat-msg-bubble{padding:8px 12px;border-radius:10px;font-size:0.82rem;line-height:1.4;word-break:break-word}
.chat-msg:not(.self) .chat-msg-bubble{background:var(--bg3);border-bottom-left-radius:2px}
.chat-msg.self .chat-msg-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:2px}
.chat-input-bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--bg3)}
.chat-input{flex:1;padding:10px 14px;background:var(--bg);border:1px solid var(--bg3);border-radius:20px;color:var(--text);font-size:0.85rem}
.chat-send{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0}

/* Tooltip */
.tooltip{position:absolute;bottom:calc(100% + 8px);background:var(--bg);color:var(--text);padding:6px 10px;border-radius:6px;font-size:0.75rem;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.ctrl-btn:hover .tooltip{opacity:1}

/* Responsive */
@media(max-width:768px){
    .chat-panel.open{width:100%;position:absolute;right:0;top:0;bottom:0;z-index:20}
    .video-grid.grid-2,.video-grid.grid-3,.video-grid.grid-4,.video-grid.grid-5,.video-grid.grid-6{grid-template-columns:1fr}
    .landing-card{padding:28px 20px}
    .ctrl-btn{width:42px;height:42px;font-size:1rem}
}
@media(max-width:480px){
    .top-bar{padding:8px 12px}
    .controls-bar{gap:6px;padding:10px 12px}
}

/* Recording indicator */
.recording-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse-rec 1.2s infinite}
@keyframes pulse-rec{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>

<!-- ============ LANDING PAGE ============ -->
<div class="landing" id="landing-page">
    <div class="landing-card">
        <div class="landing-logo">aniprotech <span>Meet</span></div>
        <p class="landing-sub">Video meetings, screen sharing, and chat — no login required.</p>
        <div class="form-group">
            <label>Your Name</label>
            <input type="text" class="form-input" id="join-name" placeholder="Enter your name" maxlength="30">
        </div>
        <div class="form-group">
            <label>Meeting ID (leave empty to create new)</label>
            <input type="text" class="form-input" id="join-room" placeholder="e.g. abc-defg-hij" maxlength="30">
        </div>
        <button class="btn btn-primary" onclick="joinMeeting()" style="margin-top:8px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Join Meeting
        </button>
        <div class="landing-divider">or</div>
        <button class="btn btn-outline" onclick="createMeeting()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Create New Meeting
        </button>
    </div>
</div>

<!-- ============ MEETING ROOM ============ -->
<div class="meeting" id="meeting-room">
    <div class="top-bar">
        <div class="top-bar-left">
            <div class="top-bar-title">aniprotech Meet</div>
            <div class="top-bar-id" id="meeting-id-display"></div>
            <div class="top-bar-timer" id="meeting-timer">00:00:00</div>
        </div>
        <div class="top-bar-right">
            <div class="participants-count" id="participants-count">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                <span id="participant-num">0</span>
            </div>
            <button class="ctrl-btn" onclick="copyMeetingLink()" title="Copy invite link" style="width:auto;border-radius:var(--radius-sm);padding:6px 12px;font-size:0.75rem;gap:4px">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
                Invite
            </button>
        </div>
    </div>

    <div style="display:flex;flex:1;min-height:0;overflow:hidden">
        <div class="video-grid" id="video-grid"></div>
        <div class="chat-panel" id="chat-panel">
            <div class="chat-header">
                <h3>Chat</h3>
                <button class="chat-close" onclick="toggleChat()">&times;</button>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-bar">
                <input type="text" class="chat-input" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChat()">
                <button class="chat-send" onclick="sendChat()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="controls-bar">
        <button class="ctrl-btn" id="btn-mic" onclick="toggleMic()" title="Toggle Microphone">
            <span id="mic-icon">&#127908;</span>
            <span class="tooltip">Mute</span>
        </button>
        <button class="ctrl-btn" id="btn-cam" onclick="toggleCam()" title="Toggle Camera">
            <span id="cam-icon">&#128247;</span>
            <span class="tooltip">Camera</span>
        </button>
        <button class="ctrl-btn" id="btn-screen" onclick="toggleScreenShare()" title="Share Screen">
            <span>&#128187;</span>
            <span class="tooltip">Share Screen</span>
        </button>
        <button class="ctrl-btn" id="btn-chat" onclick="toggleChat()" title="Chat">
            <span>&#128172;</span>
            <span class="tooltip">Chat</span>
        </button>
        <button class="ctrl-btn" id="btn-record" onclick="toggleRecording()" title="Record">
            <span>&#9679;</span>
            <span class="tooltip">Record</span>
        </button>
        <button class="ctrl-btn danger" onclick="leaveMeeting()" title="Leave Meeting">
            <span>&#128684;</span>
            <span class="tooltip">Leave</span>
        </button>
    </div>
</div>

<script>
// ============================================================
// aniprotech Meet - Full WebRTC Video Conferencing
// ============================================================

var myUserId = 'user-' + Math.random().toString(36).substr(2, 8);
var myName = '';
var roomId = '';
var ws = null;
var localStream = null;
var screenStream = null;
var peers = {};
var participants = {};
var isMicOn = true;
var isCamOn = true;
var isScreenSharing = false;
var isRecording = false;
var mediaRecorder = null;
var recordedChunks = [];
var meetingStartTime = null;
var timerInterval = null;
var ICE_SERVERS = {
    iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
    ]
};

// ---- Utility ----
function genRoomId() {
    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    var parts = [];
    for (var i = 0; i < 3; i++) {
        var p = '';
        for (var j = 0; j < 4; j++) p += chars[Math.floor(Math.random() * chars.length)];
        parts.push(p);
    }
    return parts.join('-');
}

function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

// ---- Landing ----
function createMeeting() {
    document.getElementById('join-room').value = genRoomId();
    joinMeeting();
}

function joinMeeting() {
    myName = document.getElementById('join-name').value.trim() || 'Guest';
    roomId = document.getElementById('join-room').value.trim() || genRoomId();
    document.getElementById('landing-page').classList.add('hidden');
    document.getElementById('meeting-room').classList.add('active');
    document.getElementById('meeting-id-display').textContent = roomId;
    startTimer();
    initMedia();
}

// ---- Timer ----
function startTimer() {
    meetingStartTime = Date.now();
    timerInterval = setInterval(function() {
        var elapsed = Math.floor((Date.now() - meetingStartTime) / 1000);
        var h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
        var m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
        var s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('meeting-timer').textContent = h + ':' + m + ':' + s;
    }, 1000);
}

// ---- Media ----
async function initMedia() {
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        addLocalVideoTile();
        connectWebSocket();
    } catch(e) {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
            isCamOn = false;
            updateCamButton();
            addLocalVideoTile();
            connectWebSocket();
        } catch(e2) {
            alert('Could not access camera or microphone. Please allow permissions and refresh.');
        }
    }
}

function addLocalVideoTile() {
    var grid = document.getElementById('video-grid');
    var tile = document.createElement('div');
    tile.className = 'video-tile video-tile-local';
    tile.id = 'tile-' + myUserId;
    var video = document.createElement('video');
    video.id = 'video-' + myUserId;
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    if (localStream) video.srcObject = localStream;
    tile.appendChild(video);
    var name = document.createElement('div');
    name.className = 'video-tile-name';
    name.textContent = myName + ' (You)';
    tile.appendChild(name);
    var icons = document.createElement('div');
    icons.className = 'video-tile-icons';
    icons.id = 'icons-' + myUserId;
    tile.appendChild(icons);
    grid.appendChild(tile);
    updateGridCols();
}

function addRemoteVideoTile(userId, userName) {
    if (document.getElementById('tile-' + userId)) return;
    var grid = document.getElementById('video-grid');
    var tile = document.createElement('div');
    tile.className = 'video-tile';
    tile.id = 'tile-' + userId;
    var video = document.createElement('video');
    video.id = 'video-' + userId;
    video.autoplay = true;
    video.playsInline = true;
    tile.appendChild(video);
    var name = document.createElement('div');
    name.className = 'video-tile-name';
    name.textContent = userName || userId;
    tile.appendChild(name);
    var icons = document.createElement('div');
    icons.className = 'video-tile-icons';
    icons.id = 'icons-' + userId;
    tile.appendChild(icons);
    grid.appendChild(tile);
    updateGridCols();
}

function removeVideoTile(userId) {
    var tile = document.getElementById('tile-' + userId);
    if (tile) tile.remove();
    updateGridCols();
}

function updateGridCols() {
    var grid = document.getElementById('video-grid');
    var count = grid.children.length;
    grid.className = 'video-grid';
    if (count <= 1) grid.classList.add('grid-1');
    else if (count === 2) grid.classList.add('grid-2');
    else if (count <= 4) grid.classList.add('grid-4');
    else grid.classList.add('grid-6');
}

// ---- WebRTC Peer Connections ----
function createPeerConnection(userId, userName, isInitiator) {
    var pc = new RTCPeerConnection(ICE_SERVERS);
    peers[userId] = { pc: pc, name: userName };

    if (localStream) {
        localStream.getTracks().forEach(function(track) {
            pc.addTrack(track, localStream);
        });
    }

    pc.onicecandidate = function(event) {
        if (event.candidate) {
            wsSend({ type: 'ice-candidate', candidate: event.candidate, target: userId });
        }
    };

    pc.ontrack = function(event) {
        var video = document.getElementById('video-' + userId);
        if (video) {
            video.srcObject = event.streams[0];
        }
    };

    pc.onconnectionstatechange = function() {
        if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
            removePeerConnection(userId);
        }
    };

    if (isInitiator) {
        pc.createOffer().then(function(offer) {
            return pc.setLocalDescription(offer);
        }).then(function() {
            wsSend({ type: 'offer', offer: pc.localDescription, target: userId });
        }).catch(function(e) { console.error('Offer error:', e); });
    }

    return pc;
}

function removePeerConnection(userId) {
    if (peers[userId]) {
        peers[userId].pc.close();
        delete peers[userId];
    }
    removeVideoTile(userId);
}

// ---- WebSocket ----
function connectWebSocket() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var url = proto + '//' + location.host + '/ws/meeting/' + roomId + '?user_id=' + myUserId + '&name=' + encodeURIComponent(myName);
    ws = new WebSocket(url);

    ws.onopen = function() {
        console.log('WebSocket connected');
    };

    ws.onmessage = function(event) {
        var msg = JSON.parse(event.data);
        handleSignalMessage(msg);
    };

    ws.onclose = function() {
        console.log('WebSocket disconnected');
        setTimeout(function() { connectWebSocket(); }, 3000);
    };

    ws.onerror = function(e) { console.error('WebSocket error:', e); };
}

function wsSend(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
    }
}

async function handleSignalMessage(msg) {
    switch(msg.type) {
        case 'welcome':
            participants = {};
            (msg.participants || []).forEach(function(uid) { participants[uid] = { name: uid }; });
            updateParticipantsUI();
            for (var i = 0; i < (msg.participants || []).length; i++) {
                var uid = msg.participants[i];
                addRemoteVideoTile(uid, uid);
                createPeerConnection(uid, uid, true);
            }
            break;

        case 'user-joined':
            participants[msg.user_id] = { name: msg.name };
            addRemoteVideoTile(msg.user_id, msg.name);
            updateParticipantsUI();
            addSystemChat(msg.name + ' joined the meeting');
            break;

        case 'user-left':
            removePeerConnection(msg.user_id);
            delete participants[msg.user_id];
            updateParticipantsUI();
            addSystemChat(msg.name + ' left the meeting');
            break;

        case 'offer':
            if (!peers[msg.from]) {
                addRemoteVideoTile(msg.from, msg.name || msg.from);
                participants[msg.from] = { name: msg.name || msg.from };
                updateParticipantsUI();
            }
            var pc = createPeerConnection(msg.from, msg.name || msg.from, false);
            try {
                await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
                var answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                wsSend({ type: 'answer', answer: pc.localDescription, target: msg.from });
            } catch(e) { console.error('Answer error:', e); }
            break;

        case 'answer':
            if (peers[msg.from] && peers[msg.from].pc) {
                try {
                    await peers[msg.from].pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
                } catch(e) { console.error('Set remote desc error:', e); }
            }
            break;

        case 'ice-candidate':
            if (peers[msg.from] && peers[msg.from].pc) {
                try {
                    await peers[msg.from].pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                } catch(e) { console.error('ICE error:', e); }
            }
            break;

        case 'chat':
            addChatMessage(msg.name, msg.message, false);
            break;

        case 'toggle-media':
            var iconsEl = document.getElementById('icons-' + msg.user_id);
            if (iconsEl) {
                var existing = iconsEl.querySelector('[data-kind="' + msg.kind + '"]');
                if (msg.muted) {
                    if (!existing) {
                        var span = document.createElement('span');
                        span.className = 'video-tile-icon muted';
                        span.dataset.kind = msg.kind;
                        span.textContent = msg.kind === 'audio' ? '\u{1F507}' : '\u{1F4F7}';
                        iconsEl.appendChild(span);
                    }
                } else {
                    if (existing) existing.remove();
                }
            }
            break;

        case 'screen-share-started':
            var tile = document.getElementById('tile-' + msg.user_id);
            if (tile) tile.classList.add('screen-share');
            addSystemChat(msg.name + ' is sharing their screen');
            break;

        case 'screen-share-stopped':
            var tile2 = document.getElementById('tile-' + msg.user_id);
            if (tile2) tile2.classList.remove('screen-share');
            break;
    }
}

function updateParticipantsUI() {
    var count = Object.keys(participants).length + 1;
    document.getElementById('participant-num').textContent = count;
}

// ---- Controls ----
function toggleMic() {
    if (!localStream) return;
    isMicOn = !isMicOn;
    localStream.getAudioTracks().forEach(function(t) { t.enabled = isMicOn; });
    updateMicButton();
    wsSend({ type: 'toggle-media', kind: 'audio', muted: !isMicOn });
}

function updateMicButton() {
    var btn = document.getElementById('btn-mic');
    var icon = document.getElementById('mic-icon');
    if (isMicOn) {
        btn.classList.remove('muted-state');
        icon.innerHTML = '\u{1F3A4}';
        btn.querySelector('.tooltip').textContent = 'Mute';
    } else {
        btn.classList.add('muted-state');
        icon.innerHTML = '\u{1F507}';
        btn.querySelector('.tooltip').textContent = 'Unmute';
    }
}

function toggleCam() {
    if (!localStream) return;
    isCamOn = !isCamOn;
    localStream.getVideoTracks().forEach(function(t) { t.enabled = isCamOn; });
    updateCamButton();
    var video = document.getElementById('video-' + myUserId);
    if (video) video.style.opacity = isCamOn ? '1' : '0';
    wsSend({ type: 'toggle-media', kind: 'video', muted: !isCamOn });
}

function updateCamButton() {
    var btn = document.getElementById('btn-cam');
    var icon = document.getElementById('cam-icon');
    if (isCamOn) {
        btn.classList.remove('muted-state');
        icon.innerHTML = '\u{1F4F7}';
        btn.querySelector('.tooltip').textContent = 'Camera Off';
    } else {
        btn.classList.add('muted-state');
        icon.innerHTML = '\u{1F4F9}';
        btn.querySelector('.tooltip').textContent = 'Camera On';
    }
}

async function toggleScreenShare() {
    if (!isScreenSharing) {
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            var screenTrack = screenStream.getVideoTracks()[0];

            Object.keys(peers).forEach(function(userId) {
                var sender = peers[userId].pc.getSenders().find(function(s) {
                    return s.track && s.track.kind === 'video';
                });
                if (sender) sender.replaceTrack(screenTrack);
            });

            var localVideo = document.getElementById('video-' + myUserId);
            if (localVideo) localVideo.srcObject = screenStream;

            screenTrack.onended = function() { stopScreenShare(); };
            isScreenSharing = true;
            document.getElementById('btn-screen').classList.add('active');
            wsSend({ type: 'screen-share-started' });
        } catch(e) {
            console.error('Screen share error:', e);
        }
    } else {
        stopScreenShare();
    }
}

function stopScreenShare() {
    if (!isScreenSharing) return;
    isScreenSharing = false;
    document.getElementById('btn-screen').classList.remove('active');

    if (screenStream) {
        screenStream.getTracks().forEach(function(t) { t.stop(); });
        screenStream = null;
    }

    if (localStream) {
        var camTrack = localStream.getVideoTracks()[0];
        Object.keys(peers).forEach(function(userId) {
            var sender = peers[userId].pc.getSenders().find(function(s) {
                return s.track && s.track.kind === 'video';
            });
            if (sender && camTrack) sender.replaceTrack(camTrack);
        });
    }

    var localVideo = document.getElementById('video-' + myUserId);
    if (localVideo && localStream) localVideo.srcObject = localStream;

    wsSend({ type: 'screen-share-stopped' });
}

function toggleChat() {
    document.getElementById('chat-panel').classList.toggle('open');
    updateGridCols();
}

// ---- Recording ----
async function toggleRecording() {
    if (!isRecording) {
        try {
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            var grid = document.getElementById('video-grid');
            canvas.width = 1280;
            canvas.height = 720;

            var targetStream = canvas.captureStream(30);

            var audioCtx = new AudioContext();
            var dest = audioCtx.createMediaStreamDestination();
            if (localStream) {
                localStream.getAudioTracks().forEach(function(t) {
                    var src = audioCtx.createMediaStreamSource(new MediaStream([t]));
                    src.connect(dest);
                });
            }
            dest.stream.getAudioTracks().forEach(function(t) {
                targetStream.addTrack(t);
            });

            mediaRecorder = new MediaRecorder(targetStream, { mimeType: 'video/webm;codecs=vp9' });
            recordedChunks = [];
            mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.onstop = function() {
                var blob = new Blob(recordedChunks, { type: 'video/webm' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'meeting-' + roomId + '-' + new Date().toISOString().slice(0,10) + '.webm';
                a.click();
                URL.revokeObjectURL(url);
            };
            mediaRecorder.start(1000);
            isRecording = true;
            document.getElementById('btn-record').classList.add('active');
            document.getElementById('btn-record').querySelector('.tooltip').textContent = 'Stop Recording';

            function drawFrame() {
                if (!isRecording) return;
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                var videos = grid.querySelectorAll('video');
                var count = videos.length;
                if (count === 1) {
                    drawVideoToCanvas(ctx, videos[0], 0, 0, canvas.width, canvas.height);
                } else if (count === 2) {
                    drawVideoToCanvas(ctx, videos[0], 0, 0, canvas.width / 2, canvas.height);
                    drawVideoToCanvas(ctx, videos[1], canvas.width / 2, 0, canvas.width / 2, canvas.height);
                } else if (count <= 4) {
                    var cols = 2, rows = 2;
                    var cw = canvas.width / cols, ch = canvas.height / rows;
                    for (var i = 0; i < Math.min(count, 4); i++) {
                        drawVideoToCanvas(ctx, videos[i], (i % cols) * cw, Math.floor(i / cols) * ch, cw, ch);
                    }
                } else {
                    var cols3 = 3, rows3 = Math.ceil(count / 3);
                    var cw3 = canvas.width / cols3, ch3 = canvas.height / rows3;
                    for (var j = 0; j < count; j++) {
                        drawVideoToCanvas(ctx, videos[j], (j % cols3) * cw3, Math.floor(j / cols3) * ch3, cw3, ch3);
                    }
                }
                requestAnimationFrame(drawFrame);
            }
            drawFrame();
        } catch(e) {
            console.error('Recording error:', e);
            alert('Recording not supported in this browser.');
        }
    } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        isRecording = false;
        document.getElementById('btn-record').classList.remove('active');
        document.getElementById('btn-record').querySelector('.tooltip').textContent = 'Record';
    }
}

function drawVideoToCanvas(ctx, video, x, y, w, h) {
    if (!video.videoWidth) return;
    var vw = video.videoWidth, vh = video.videoHeight;
    var scale = Math.max(w / vw, h / vh);
    var sw = vw * scale, sh = vh * scale;
    ctx.drawImage(video, x + (w - sw) / 2, y + (h - sh) / 2, sw, sh);
}

// ---- Chat ----
function sendChat() {
    var input = document.getElementById('chat-input');
    var msg = input.value.trim();
    if (!msg) return;
    wsSend({ type: 'chat', message: msg });
    addChatMessage(myName, msg, true);
    input.value = '';
}

function addChatMessage(name, message, isSelf) {
    var container = document.getElementById('chat-messages');
    var div = document.createElement('div');
    div.className = 'chat-msg' + (isSelf ? ' self' : '');
    div.innerHTML = '<div class="chat-msg-name">' + escapeHtml(name) + '</div><div class="chat-msg-bubble">' + escapeHtml(message) + '</div>';
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function addSystemChat(text) {
    var container = document.getElementById('chat-messages');
    var div = document.createElement('div');
    div.style.cssText = 'text-align:center;font-size:0.75rem;color:var(--text3);padding:4px 0';
    div.textContent = text;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

// ---- Copy Invite Link ----
function copyMeetingLink() {
    var link = location.origin + '/meeting#room=' + roomId;
    if (navigator.clipboard) {
        navigator.clipboard.writeText(link).then(function() {
            addSystemChat('Invite link copied to clipboard!');
        });
    } else {
        var ta = document.createElement('textarea');
        ta.value = link;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        addSystemChat('Invite link copied to clipboard!');
    }
}

// ---- Leave ----
function leaveMeeting() {
    Object.keys(peers).forEach(function(userId) {
        peers[userId].pc.close();
    });
    peers = {};
    if (localStream) localStream.getTracks().forEach(function(t) { t.stop(); });
    if (screenStream) screenStream.getTracks().forEach(function(t) { t.stop(); });
    if (ws) ws.close();
    if (timerInterval) clearInterval(timerInterval);
    if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        isRecording = false;
    }
    document.getElementById('meeting-room').classList.remove('active');
    document.getElementById('landing-page').classList.remove('hidden');
    document.getElementById('video-grid').innerHTML = '';
    document.getElementById('chat-messages').innerHTML = '';
    document.getElementById('chat-panel').classList.remove('open');
}

// ---- Auto-join from URL hash ----
(function() {
    if (location.hash && location.hash.indexOf('room=') !== -1) {
        var roomMatch = location.hash.match(/room=([^&]+)/);
        if (roomMatch) {
            document.getElementById('join-room').value = roomMatch[1];
        }
    }
})();
</script>
